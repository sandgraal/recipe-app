<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Creaciones Colibrí</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #fdf8f3; color: #2f2b28;
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #17120f; color: #f3ece4; } }
  .wrap { max-width: 30rem; }
  .emoji { font-size: 3rem; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0.75rem 0 0.5rem; color: #1f8a70; }
  @media (prefers-color-scheme: dark) { h1 { color: #34a98c; } }
  p { color: #5c4a4a; line-height: 1.6; margin: 0 0 1.25rem; }
  @media (prefers-color-scheme: dark) { p { color: #b8a99f; } }
  a { display: inline-block; padding: 0.6rem 1.4rem; border-radius: 12px; background: #f16745; color: #fff; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="emoji">🌿</div>
    <h1>You're offline</h1>
    <p>This recipe hasn't been saved for offline use yet. Recipes you've opened before are available without a connection. / Esta receta aún no está guardada sin conexión. Las recetas que ya abriste sí están disponibles.</p>
    <a href="/">Go to My Cookbook</a>
  </div>
</body>
</html>
